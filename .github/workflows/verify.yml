name: Verify and deploy The Workout Tracker
on: [push, pull_request, workflow_dispatch]
permissions: {}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the limit ratchet compares with the previous commit
          persist-credentials: false # don't leave the git token on disk
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Limits only tighten
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tooling/lint/ratchet.mjs "${BASE:-HEAD~1}"
      - run: pnpm verify
      - run: pnpm test:unit
      - run: pnpm --filter @form/workout exec playwright install --with-deps chrome
      - run: pnpm test:browser
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: workout-test-results
          path: |
            apps/workout/test-results
            apps/workout/playwright-report
          if-no-files-found: ignore
      - name: Lighthouse, asset budgets, and offline artwork
        run: pnpm performance:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workout-performance-results
          path: |
            .lighthouseci
            apps/workout/playwright-report/performance
            apps/workout/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
        with:
          path: apps/workout/dist
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages site
      id-token: write # authenticate the Pages deployment
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
