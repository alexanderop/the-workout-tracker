name: Verify and deploy The Workout Tracker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:unit
      - run: pnpm --filter @form/workout exec playwright install --with-deps chrome
      - run: pnpm test:browser
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workout-test-results
          path: |
            apps/workout/test-results
            apps/workout/playwright-report
          if-no-files-found: ignore
      - run: pnpm --filter @form/workout build
        if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
        with:
          path: apps/workout/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
