name: Verify and deploy The Workout Tracker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
        with:
          path: apps/workout/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            apps/workout/test-results/
            apps/workout/playwright-report/
            packages/ui/test-results/
            packages/ui/.vitest/
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @form/ui test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-visual-evidence
          include-hidden-files: true
          path: |
            packages/ui/.vitest/
            packages/ui/test-results/
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == (vars.PAGES_BRANCH || 'main')
    needs: [verify, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
