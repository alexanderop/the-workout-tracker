<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f2f1ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121316"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Set the saved theme and accent before first paint. Keys and values
      // match src/app/appearance.ts; invalid values keep the defaults.
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("workout-theme");
        var accent = localStorage.getItem("workout-accent");
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "dark" : "light";
        if (/^(blue|teal|violet|pink|sand)$/.test(accent))
          root.dataset.accent = accent;
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="A quieter space to get stronger. Plan workouts, log sets, and track your progress offline."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="The Workout Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/startup.css" />
    <title>The Workout Tracker</title>
  </head>
  <body>
    <div id="app">
      <div class="startup-shell" role="status">
        <img src="/icon.svg" width="56" height="56" alt="" />
        <p>Opening your training journal</p>
        <noscript
          >Enable JavaScript to open your saved workouts.
          <span lang="de"
            >Aktiviere JavaScript, um deine gespeicherten Trainings zu
            öffnen.</span
          ></noscript
        >
      </div>
    </div>
    <script>
      // Show the startup text in German before the app loads. Mirrors
      // src/app/language.ts: the key holds JSON, and "system" or no choice
      // follows the browser. The app sets the language itself once it starts.
      try {
        var saved = JSON.parse(localStorage.getItem("workout-language"));
        var german = saved === "de";
        if (saved !== "de" && saved !== "en") {
          var found = Array.prototype.find.call(
            navigator.languages || [],
            function (tag) {
              return /^(de|en)(-|$)/i.test(tag);
            },
          );
          german = /^de/i.test(found || "");
        }
        // Start the catalog download before the app code asks for it. The
        // build lists the file names; the dev server has none.
        var files = window.__catalogFiles;
        var file = files && files[german ? "de" : "en"];
        if (file) {
          var preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "fetch";
          preload.crossOrigin = "";
          preload.href = window.__catalogBase + file;
          document.head.appendChild(preload);
        }
        if (german) {
          document.documentElement.lang = "de";
          document.querySelector(".startup-shell p").textContent =
            "Dein Trainingstagebuch wird geöffnet";
          document
            .querySelector('meta[name="description"]')
            .setAttribute(
              "content",
              "Ein ruhigerer Ort, um stärker zu werden. Plane Trainings, erfasse Sätze und verfolge deinen Fortschritt – auch offline.",
            );
        }
      } catch (error) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
